name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.6.5f1
  BUILD_METHOD: Rampartbound.Editor.RampartboundBuildPipeline.BuildAndroidAPK
  BUILD_OUTPUT: Builds/Android/Rampartbound_debug.apk

jobs:
  build-apk:
    name: Build APK (Unity 6000.6.5f1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Unity's Android builder image is very large. Free space on this ephemeral
      # GitHub-hosted runner before Docker pulls the image; project files are untouched.
      - name: Free runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/.ghcup /usr/lib/jvm
          docker system prune --all --force --volumes || true
          df -h /

      - name: Build Android APK
        timeout-minutes: 90
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          buildMethod: ${{ env.BUILD_METHOD }}
          allowDirtyBuild: false

      - name: Verify APK exists
        shell: bash
        run: test -s "${BUILD_OUTPUT}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rampartbound-Android-APK
          path: ${{ env.BUILD_OUTPUT }}
          if-no-files-found: error
          retention-days: 14
